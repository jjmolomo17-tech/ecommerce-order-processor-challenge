<section class="bg-white shadow rounded-xl p-5">

    <h2 class="text-2xl font-bold mb-4">
        Search / Filter
    </h2>

    <div class="grid md:grid-cols-2 gap-6">

        <!-- Search -->
        <div>

            <label
                class="block font-semibold mb-2">
                Search Order ID or Customer
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="ORD-0001 or Joy"
                class="w-full border rounded-lg p-2">

            <button
                id="searchBtn"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg mt-2">

                Search Order

            </button>

        </div>

        <!-- Dynamic Category Dropdown -->
        <div>

            <label
                class="block font-semibold mb-2">
                Category Filter
            </label>

            <select
                id="categoryFilter"
                class="w-full border rounded-lg p-2">

                <option value="all">
                    All Categories
                </option>

            </select>

        </div>

    </div>

    <div class="mt-6">

        <label
            class="block font-semibold mb-2">
            Minimum Price
        </label>

        <div class="flex gap-2">

            <input
                type="number"
                id="minPrice"
                value="0"
                class="border rounded-lg p-2">

            <button
                id="priceFilterBtn"
                class="bg-green-600 text-white px-4 py-2 rounded-lg">

                Filter Price

            </button>

        </div>

    </div>

    <!-- Challenge 4 Results -->
    <div
        id="analysisResults"
        class="mt-6 bg-slate-100 rounded-xl p-4">

    </div>

</section>

    <! -- Product Lookup Section -->
<section class="bg-white shadow rounded-xl p-5">

    <h2 class="text-2xl font-bold mb-4">
        Product Lookup
    </h2>

    <div class="grid md:grid-cols-2 gap-4">

        <div>

            <label class="block font-semibold mb-2">
                Enter Product Name
            </label>

            <input
                type="text"
                id="productInput"
                placeholder="Laptop"
                class="w-full border rounded-lg p-2">

            <button
                id="lookupBtn"
                class="bg-purple-600 text-white px-4 py-2 rounded-lg mt-2">

                Find Product

            </button>

        </div>

        <div>

            <h3 class="font-semibold mb-2">
                Product Information
            </h3>

            <div
                id="productResult"
                class="bg-slate-100 p-4 rounded-lg">

                Search for a product.

            </div>

        </div>

    </div>

    <div
        id="mapStats"
        class="mt-4">
    </div>

</section>
      
    

<!-- Data Processing Section -->
<!-- RegExp Validation Tool -->
<div class="mt-8 border-t pt-6">

    <h3 class="text-xl font-bold mb-4">
        Validation Tool
    </h3>

    <label class="block font-semibold mb-2">
        Test Email or Order ID
    </label>

    <input
        type="text"
        id="validationInput"
        placeholder="Enter email or order ID"
        class="w-full border rounded-lg p-3">

    <button
        id="validateBtn"
        class="mt-3 bg-purple-600 text-white px-4 py-2 rounded-lg">

        Validate

    </button>

    <div
        id="validationResult"
        class="mt-4">
    </div>

</div>
    <!-- Export Output -->
    <div class="mb-4">

        <label
            class="block font-semibold mb-2">

            JSON Export

        </label>

        <textarea
            id="jsonOutput"
            rows="10"
            readonly
            class="w-full border rounded p-3">
        </textarea>

    </div>

    <!-- Import -->
    <div class="mb-4">

        <label
            class="block font-semibold mb-2">

            Import JSON

        </label>

        <textarea
            id="jsonInput"
            rows="10"
            placeholder="Paste order JSON here..."
            class="w-full border rounded p-3">
        </textarea>

    </div>

    <button
        id="importJsonBtn"
        class="bg-green-600 text-white px-4 py-2 rounded">

        Import Orders

    </button>

    <!-- Status Message -->

    <div
        id="jsonStatus"
        class="mt-4">
    </div>

</section>

    <!-- Export JSON -->
    <div class="mb-6">

        <button
            id="exportJsonBtn"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg">

            Export Orders JSON

        </button>

    </div>

    <!-- Export Output -->
    <div class="mb-6">

        <label class="block font-semibold mb-2">
            Exported JSON
        </label>

        <textarea
            id="jsonOutput"
            rows="10"
            class="w-full border rounded-lg p-3"
            readonly>
        </textarea>

    </div>

    <!-- Import Input -->
    <div class="mb-4">

        <label class="block font-semibold mb-2">
            Import Orders JSON
        </label>

        <textarea
            id="jsonInput"
            rows="10"
            placeholder="Paste JSON here..."
            class="w-full border rounded-lg p-3">
        </textarea>

    </div>

    <button
        id="importJsonBtn"
        class="bg-green-600 text-white px-4 py-2 rounded-lg">

        Import Orders

    </button>

    <!-- Status -->
    <div
        id="jsonStatus"
        class="mt-4">
    </div>

</section>

</section>
