            </select>

        </div>

    </div>

    <div class="mt-6">

        <label

<section class="bg-white shadow rounded-xl p-5">

    <h2 class="text-2xl font-bold mb-4">
        Product Lookup
    </h2>

    <div class="grid md:grid-cols-2 gap-4">

        <div>

        </div>

        <div>

        </div>

    </div>
