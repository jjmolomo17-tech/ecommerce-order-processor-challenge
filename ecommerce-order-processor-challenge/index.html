<!-- Search & Filter Section -->
<section class="bg-white shadow rounded-xl p-5">

    <h2 class="text-2xl font-bold mb-4">
        Search / Filter
    </h2>

    <div class="grid md:grid-cols-2 gap-6">

        <!-- Search Orders -->
        <div>

            <label class="block font-semibold mb-2">
                Search Order ID or Customer Name
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="ORD-0001 or Joy"
                class="w-full border rounded-lg p-2">

            <button
                id="searchBtn"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg mt-2 hover:bg-blue-700">

                Search Order

            </button>

        </div>

        <!-- Category Filter -->
        <div>

            <label class="block font-semibold mb-2">
                Filter By Category
            </label>

            <select
                id="categoryFilter"
                class="w-full border rounded-lg p-2">

                <option value="all">
                    All Categories
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Furniture">
                    Furniture
                </option>

                <option value="Accessories">
                    Accessories
                </option>

            </select>

        </div>

    </div>

    <!-- Price Filter -->
    <div class="mt-6">

        <label class="block font-semibold mb-2">
            Minimum Price
        </label>

        <div class="flex gap-2">

            <input
                type="number"
                id="minPrice"
                value="0"
                class="border rounded-lg p-2 w-40">

            <button
                id="priceFilterBtn"
                class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">

                Filter Price

            </button>

        </div>

    </div>
